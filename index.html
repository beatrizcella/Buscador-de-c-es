<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Raças de Cães</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="site-header py-4 mb-4">
    <div class="container text-center">
      <h1 class="h3 mb-1 text-white"> Buscador de Raças de Cães</h1>
      <p class="mb-0 text-white">Explore raças, sub-raças e fotos</p>
    </div>
  </header>

  <main class="container pb-5">

    <section class="card shadow-sm mb-4 border-0">
      <div class="card-body p-4">
        <h2 class="h5 text-laranja-escuro mb-1">1. Pesquisar raça</h2>
        <p class="text-muted small mb-3">
          Digite uma raça (ex.: <em>hound</em>) ou uma sub-raça (ex.: <em>afghan hound</em>).
        </p>

        <input
          id="breedInput"
          type="text"
          class="form-control form-control-lg"
          list="breedList"
          placeholder="Digite o nome da raça..."
          autocomplete="off"
        >
        <datalist id="breedList"></datalist>

        <div class="d-flex flex-wrap gap-2 mt-3">
          <button id="btnSubBreeds" class="btn btn-outline-laranja js-action" type="button">Ver sub-raças</button>
          <button id="btnGallery" class="btn btn-laranja js-action" type="button">Ver galeria</button>
          <button id="btnBreedRandom" class="btn btn-outline-laranja js-action" type="button">Foto aleatória desta raça</button>
          <button id="btnRandom" class="btn btn-outline-laranja js-action" type="button">Foto de qualquer raça</button>
          <button id="btnLogs" class="btn btn-outline-laranja" type="button">Ver logs</button>
        </div>

        <div id="alertBox" class="alert d-none mt-3 mb-0" role="alert"></div>
      </div>
    </section>

    <div id="spinner" class="text-center my-3 d-none">
      <div class="spinner-border text-laranja" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <section id="subBreedsSection" class="card shadow-sm mb-4 border-0 d-none">
      <div class="card-header section-header d-flex justify-content-between align-items-center">
        <h2 id="subBreedsTitle" class="h6 mb-0 text-laranja-escuro">Sub-raças</h2>
        <button id="closeSubBreeds" class="btn-close" type="button" aria-label="Fechar"></button>
      </div>
      <div class="card-body">
        <p class="small text-muted mb-2">Clique em uma sub-raça para ver a galeria dela.</p>
        <div id="subBreedsList" class="d-flex flex-wrap gap-2"></div>
        <p id="subBreedsEmpty" class="text-muted mb-0 d-none"></p>
      </div>
    </section>

    <section id="gallerySection" class="card shadow-sm mb-4 border-0 d-none">
      <div class="card-header section-header d-flex justify-content-between align-items-center">
        <h2 id="galleryTitle" class="h6 mb-0 text-laranja-escuro">Galeria</h2>
        <button id="closeGallery" class="btn-close" type="button" aria-label="Fechar"></button>
      </div>
      <div class="card-body">
        <div id="gallery" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></div>
        <div class="text-center mt-4">
          <button id="loadMoreBtn" class="btn btn-outline-laranja d-none" type="button">Carregar mais</button>
        </div>
      </div>
    </section>

    <section id="randomSection" class="card shadow-sm mb-4 border-0 d-none">
      <div class="card-header section-header d-flex justify-content-between align-items-center">
        <h2 class="h6 mb-0 text-laranja-escuro">Foto aleatória</h2>
        <button id="closeRandom" class="btn-close" type="button" aria-label="Fechar"></button>
      </div>
      <div class="card-body text-center">
        <img id="randomImg" class="img-fluid rounded random-img mb-2" alt="Foto de cachorro">
        <p id="randomCaption" class="text-muted small mb-3"></p>
        <button id="btnRandomAgain" class="btn btn-laranja js-action" type="button">Nova foto</button>
      </div>
    </section>

    <section id="logsSection" class="card shadow-sm mb-4 border-0 d-none">
      <div class="card-header section-header d-flex justify-content-between align-items-center">
        <h2 class="h6 mb-0 text-laranja-escuro">Logs registrados</h2>
        <button id="closeLogs" class="btn-close" type="button" aria-label="Fechar"></button>
      </div>
      <div class="card-body">
        <div id="logsMensagem" class="small text-muted mb-2"></div>
        <div id="logsList"></div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
